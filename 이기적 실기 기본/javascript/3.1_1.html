<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연산자</title>
</head>
<body>
    <script>
        let a = 5;
        let b = 10;
        let c = 10;
        let result;

        result = a + b;
        document.write(result + "<br>");

        a++;
        document.write(a + "<br>");

        a += b;
        document.write(a + "<br>");

        result = a > b;
        document.write(result + "<br>");

        result = a > b && b == c;
        document.write(result + "<br>");
    </script>
</body>
</html>
