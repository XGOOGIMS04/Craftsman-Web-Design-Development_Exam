<!-- while문 77p -->
<!DOCTYPE html>
<html lang=ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>while문</title>
</head>
<body>
    <script>
        let count = 1;
        while(count <= 5){
            document.write("hello" + count);
            count++;
        }
    </script>
</body>
</html>
