<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조건문</title>
</head>
<body>
    <script>
        let num = 5;

        if(num % 2 == 0) {
            alert("짝수");
        }
        else {
            alert("홀수");
        }
    </script>
</body>
