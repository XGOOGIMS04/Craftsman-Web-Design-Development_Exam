<!-- div, h1, p, br, strong 태그 활용 예제 24p-->
<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>태그활용예제1</title>
    </head>
    <body>
        <div>
            <h1>HTML</h1>
            <h2>html5란?</h2>
            <p>html5는 어쩌고 어쩌고라서, <strong>구조적 요소와</strong>을 포함하여<br />웹 콘텐츠 어쩌고 저쩌고 입니다.</p>
        </div>
    </body>
</html>
