<!-- form, table, input, select, button 태그 활용 에제 26p-->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>태그활용예제4</title>
</head>
<body>
    <form>
        <table border="1">
            <tr>
                <th>이름</th>
                <td><input type="text"></td>
            </tr>
            <tr>
                <th>이메일</th>
                <td>
                    <input type="text"> @
                    <select>
                        <option>직접입력</option>
                        <option>naver.com</option>
                        <option>gmail.com</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2"><button>제출</button></td>
            </tr>
        </table>
    </form>
</body>
</html>
