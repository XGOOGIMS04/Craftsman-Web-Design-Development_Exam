<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animate 작성 방법</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./4.3_2.js"></script>
    <style>
        .box1 {
            background: yellow;
            width: 100px;
            height: 100px;
            position: absolute;
        }
        .box2 {
            background: green;
            width: 100px;
            height: 100px;
            position: absolute;
            top: 120px;
        }
    </style>
</head>
<body>
    <div class="box1">
        박스
    </div>
    <div class="box2">
        박스
    </div>
</body>
</html>
