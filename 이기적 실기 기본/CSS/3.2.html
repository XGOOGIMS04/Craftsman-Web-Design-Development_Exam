<!-- css 주요 속성_Position 속성 -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position 속성</title>
    <link rel="stylesheet" href="./3.2.css">
</head>
<body>
    <h1>position:relative</h1>
    <div class="box1">
        <p class="box1-1">box1-1</p>
        <p class="box1-2">box1-2</p>
    </div>
    <h1>position:absolute</h1>
    <div class="box2">
        <p class="box2-1">box1-1</p>
        <p class="box2-2">box1-2</p>
    </div>
    <h1>position:fixed</h1>
    <div class="box3">
        <p class="box3-1">box1-1</p>
        <p class="box3-2">box1-2</p>
    </div>
</body>
</html>
