<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹디기 레이아웃 F-1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        #wrap {
            width: 100%;
        }
        #header {
            width: 1340px;
            margin: 0 auto;
            display: flex;
        }
        #header .logo {
            width: 20%;
            height: 100px;
            background-color: #efefef;
        }
        #header .nav {
            width: 80%;
            height: 100px;
            background-color: #e3e3e3;
        }
        #slider {
            width: 100%;    
            height: 350px;
            background-color: #d9d9d9;
            position: relative;
        }
        #slider .link {
            width: 1340px;
            height: 100px;
            background-color: #d1d1d1;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        #contents {
            width: 1340px;
            margin: 0 auto;
        }
        #contents .banner {
            width: 100%;
            height: 150px;
            background-color: #c7c7c7;
        }
        #contents .notice {
            width: 100%;
            height: 400px;
            background-color: #bbbbbb;
        }
        #footer {
            width: 1340px;
            margin: 0 auto;
            display: flex;
        }
        #footer .footer1 {
            width: 20%;
            height: 120px;
            background-color: #d9d9d9;
        }
        #footer .footer2 {
            width: 80%;
            height: 120px;
        }
        #footer .footer2 .footer2-1 {
            width: 100%;
            height: 60px;
            background-color: #cacaca;
        }
        #footer .footer2 .footer2-2 {
            width: 100%;
            height: 60px;
            background-color: #a3a3a3;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <!-- header -->
        <header id="header">
            <h1 class="logo"></h1>
            <nav class="nav"></nav>
        </header>

        <!-- slider -->
        <article id="slider">
            <div class="link"></div>
        </article>

        <!-- contents -->
        <section id="contents">
            <article class="banner"></article>
            <article class="notice"></article>
        </section>

        <!-- footer -->
        <footer id="footer">
            <div class="footer1"></div>
            <div class="footer2">
                <div class="footer2-1"></div>
                <div class="footer2-2"></div>
            </div>
        </footer>
    </div>
</body>
</html>
