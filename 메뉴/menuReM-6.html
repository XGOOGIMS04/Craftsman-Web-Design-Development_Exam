<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>웹디기 메뉴 M-6 복습</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            li {
                list-style: none;
            }
            a {
                text-decoration: none;
                color: #000;
            }
            #wrap {
                width: 100%;
                display: flex;
                flex-wrap: wrap;
            }
            #aside {
                width: 200px;
            }
            #aside h1 {
                width: 100%;
                height: 100px;
                background-color: #efefef;
            }
            #aside nav {
                width: 100%;
                height: 700px;
                background-color: #e3e3e3;
            }
            #main {
                width: calc(100% - 200px);
            }
            #main::after {
                content: '';
                width: 0%;
                height: 193px;
                background-color: #b0b0b0;
                position: absolute;
                left: 0;
                top: 100px;
                z-index: 1;
                transition: all 250ms;
            }
            #main.on::after {
                width: 100%;
            }
            #slider {
                width: 100%;
                height: 400px;
                background-color: #d9d9d9;
            }
            #link {
                width: 100%;
                height: 150px;
                background-color: #d1d1d1;
            }
            #contents {
                width: 100%;
                display: flex;
            }
            #contents .content1 {
                width: 50%;
                height: 250px;
                background-color: #c7c7c7;
            }
            #contents .content2 {
                width: 50%;
                height: 250px;
                background-color: #bcbcbc;
            }
            #footer {
                width: 100%;
                display: flex;
            }
            #footer .footer1 {
                width: 20%;
                height: 120px;
                background-color: #b1b1b1;
            }
            #footer .footer2 {
                width: 60%;
            }
            #footer .footer2 .footer2-1 {
                width: 100%;
                height: 60px;
                background-color: #a3a3a3;
            }
            #footer .footer2 .footer2-2 {
                width: 100%;
                height: 60px;
                background-color: #9d9d9d;
            }
            #footer .footer3 {
                width: 20%;
                height: 120px;
                background-color: #929292;
            }

            /* nav */
            .nav {
                position: relative;
                z-index: 1000;
            }
            .nav > ul {}
            .nav > ul > li {
                position: relative;
            }
            .nav > ul > li > a {
                display: block;
                padding: 10px;
                background-color: #ccc;
                text-align: center;
            }
            .nav > ul > li > a:hover {
                background-color: #aeaeae;
            }
            .nav > ul > li > ul {
                display: none;
                position: absolute;
                right: -500px;
                top: 0;
                width: 500px;
            }
            .nav > ul > li > ul > li {
                display: inline;
            }
            .nav > ul > li > ul > li > a {
                display: inline-block;
                padding: 10px;
                width: 100px;
                text-align: center;
            }
            .nav > ul > li > ul > li > a:hover {
                background: #a2a2a2;
            }
        </style>
    </head>
    <body>
        <div id="wrap">
            <aside id="aside">
                <h1></h1>
                <nav class="nav">
                    <ul>
                        <li>
                            <a href="#">메뉴1</a>
                            <ul class="submenu">
                                <li><a href="#">서브메뉴1-1</a></li>
                                <li><a href="#">서브메뉴1-2</a></li>
                                <li><a href="#">서브메뉴1-3</a></li>
                                <li><a href="#">서브메뉴1-4</a></li>
                            </ul>
                        </li>
                        <li>
                            <a href="#">메뉴2</a>
                            <ul class="submenu">
                                <li><a href="#">서브메뉴1-1</a></li>
                                <li><a href="#">서브메뉴1-2</a></li>
                                <li><a href="#">서브메뉴1-3</a></li>
                                <li><a href="#">서브메뉴1-4</a></li>
                            </ul>
                        </li>
                        <li>
                            <a href="#">메뉴3</a>
                            <ul class="submenu">
                                <li><a href="#">서브메뉴1-1</a></li>
                                <li><a href="#">서브메뉴1-2</a></li>
                                <li><a href="#">서브메뉴1-3</a></li>
                                <li><a href="#">서브메뉴1-4</a></li>
                            </ul>
                        </li>
                        <li>
                            <a href="#">메뉴4</a>
                            <ul class="submenu">
                                <li><a href="#">서브메뉴1-1</a></li>
                                <li><a href="#">서브메뉴1-2</a></li>
                                <li><a href="#">서브메뉴1-3</a></li>
                                <li><a href="#">서브메뉴1-4</a></li>
                            </ul>
                        </li>
                    </ul>
                </nav>
            </aside>
            <!-- //aside -->

            <main id="main">
                <article id="slider"></article>
                <article id="link"></article>
                <section id="contents">
                    <div class="content1"></div>
                    <div class="content2"></div>
                </section>
            </main>
            <!-- //main -->

            <footer id="footer">
                <div class="footer1"></div>
                <div class="footer2">
                    <div class="footer2-1"></div>
                    <div class="footer2-2"></div>
                </div>
                <div class="footer3"></div>
            </footer>
            <!-- //footer -->
        </div>
        <!-- //wrap -->

        <!-- <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>

        <script>
            window.onload = function(){
                let navList = document.querySelector('.nav > ul')

                navList.addEventListener("mouseover", function(){
                    navList.querySelectorAll('.submenu').forEach(sub => {
                        sub.style.display = 'block'
                    })
                    document.getElementById('main').classList.add('on')
                })
                navList.addEventListener("mouseout", function(){
                    navList.querySelectorAll('.submenu').forEach(sub => {
                        sub.style.display = 'none'
                    })
                    document.getElementById('main').classList.remove('on')
                })
            }
        </script>
    </body>
</html>
