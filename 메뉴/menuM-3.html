<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>웹디기 메뉴 M-3</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            li {
                list-style: none;
            }
            a {
                text-decoration: none;
                color: #000;
            }
            #wrap {
                width: 1200px;
                margin: 0 auto;
            }
            #header {
                width: 100%;
                display: flex;
                position: relative; /*메뉴 기준점*/
            }
            #header::after { /* 가상요소 */
                content: '';
                width: 100%;
                height: 0; /*스크립트로 처리해줄것*/
                background-color: #808080;
                position: absolute;
                z-index: 1; /* .nav보다 우선순위를 낮게 설명함 */
                left: 0;
                top: 100px;
                transition: all 400ms;
            }
            #header.on::after {
                height: 156px; /* header가 0이였다가 class on이 생겼을때 155로 바뀜 */
            } 
            #header .logo {
                width: 20%;
                height: 100px;
                background-color: #efefef;
            }
            #header .nav {
                width: 80%;
                background-color: #e3e3e3;
            }
            #slider {
                width: 100%;
                height: 300px;
                background-color: #d9d9d9;
            }
            #contents {
                width: 100%;
                display: flex;
            }
            #contents .content1 {
                width: 33.3333%;
                height: 200px;
                background-color: #d1d1d1;
            }
            #contents .content2 {
                width: 33.3333%;
                height: 200px;
                background-color: #c7c7c7;
            }
            #contents .content3 {
                width: 33.3333%;
                height: 200px;
                background-color: #bcbcbc;
            }
            #footer {
                width: 100%;
                display: flex;
            }
            #footer .footer1 {
                width: 20%;
                height: 100px;
                background-color: #b1b1b1;
            }
            #footer .footer2 {
                width: 60%;
                height: 100px;
                background-color: #a3a3a3;
            }
            #footer .footer3 {
                width: 20%;
                height: 100px;
                background-color: #9d9d9d;
            }

            /* nav */
            .nav {
                position: relative; /* z-index는 position이랑 같이 써야함 */
                z-index: 1000; /*겹쳤을때 우선순위 정해줌*/
            }
            .nav > ul {
                display: flex;
                justify-content: right;
                margin-top: 61px; /*밑 고정*/
            }
            .nav > ul > li {
                position: relative;
            }
            .nav > ul > li > a {
                display: inline-block;
                padding: 10px 50px;
                background-color: #b0b0b0;
            }
            .nav > ul > li > a:hover {
                background-color: #696969;
            }
            .nav > ul > li > ul {
                text-align: center;
                position: absolute;
                top: 39px; /*이게 없으면 서브메뉴가 a태그 위에 겹침*/
                left: 0;
                width: 100%; /* 박스사이징 하고 적용이 안된 너비 처리 */
            }
            .nav > ul > li > ul > li {}
            .nav > ul > li > ul > li > a {
                display: inline-block;
                width: 100%;
                padding: 10px;
                box-sizing: border-box;
            }
            .nav > ul > li > ul > li > a:hover {
                background-color: #8f8f8f;
            }

            /* js css */
            .nav > ul > li > ul {
                display: block;
                height: 0;
                overflow: hidden;
                transition: all 400ms;
            }
        </style>
    </head>
    <body>
        <div id="wrap">
            <div id="header">
                <div class="logo"></div>
                <nav class="nav">
                    <ul>
                        <li>
                            <a href="#">메뉴1</a>
                            <ul class="submenu">
                                <li><a href="#">서브메뉴1-1</a></li>
                                <li><a href="#">서브메뉴1-2</a></li>
                                <li><a href="#">서브메뉴1-3</a></li>
                                <li><a href="#">서브메뉴1-4</a></li>
                            </ul>
                        </li>
                        <li>
                            <a href="#">메뉴2</a>
                            <ul class="submenu">
                                <li><a href="#">서브메뉴2-1</a></li>
                                <li><a href="#">서브메뉴2-2</a></li>
                                <li><a href="#">서브메뉴2-3</a></li>
                                <li><a href="#">서브메뉴2-4</a></li>
                            </ul>
                        </li>
                        <li>
                            <a href="#">메뉴3</a>
                            <ul class="submenu">
                                <li><a href="#">서브메뉴3-1</a></li>
                                <li><a href="#">서브메뉴3-2</a></li>
                                <li><a href="#">서브메뉴3-3</a></li>
                                <li><a href="#">서브메뉴3-4</a></li>
                            </ul>
                        </li>
                        <li>
                            <a href="#">메뉴4</a>
                            <ul class="submenu">
                                <li><a href="#">서브메뉴4-1</a></li>
                                <li><a href="#">서브메뉴4-2</a></li>
                                <li><a href="#">서브메뉴4-3</a></li>
                                <li><a href="#">서브메뉴4-4</a></li>
                            </ul>
                        </li>
                    </ul>
                </nav>
            </div>
            <!-- //header -->

            <div id="slider"></div>
            <!-- //slider -->

            <div id="contents">
                <div class="content1"></div>
                <div class="content2"></div>
                <div class="content3"></div>
            </div>
            <!-- //contents -->

            <div id="footer">
                <div class="footer1"></div>
                <div class="footer2"></div>
                <div class="footer3"></div>
            </div>
            <!-- //footer -->
        </div>
        <!-- //wrap -->

        <script>
            window.onload = function(){
                let navList = document.querySelector('.nav > ul')

                navList.addEventListener("mouseover", () => { // 화살표 함수 사용
                    navList.querySelectorAll('.submenu').forEach(sub => {
                        sub.style.height = '156px'
                    })
                    document.getElementById('header').classList.add('on') // header에 class = 'on'을 붙여라?
                })
                navList.addEventListener("mouseout", () => { // 화살표 함수 사용
                    navList.querySelectorAll('.submenu').forEach(sub => {
                        sub.style.height = '0px'
                    })
                    document.getElementById('header').classList.remove('on')
                })
            }
        </script>
    </body>
</html>
